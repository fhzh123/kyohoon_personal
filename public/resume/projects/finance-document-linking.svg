      <text x="550" y="242" font-size="24">…</text>
    </g>
    <use href="#graph" x="347" y="350" color="#a66a08"/>
    <use href="#graph" x="429" y="350" color="#247ca0"/>
    <use href="#graph" x="500" y="350" color="#4d608c"/>
    <use href="#graph" x="603" y="350" color="#a55c34"/>
    <use href="#pairs" x="327" y="378"/><use href="#pairs" x="409" y="378"/>
    <use href="#pairs" x="480" y="378"/><use href="#pairs" x="583" y="378"/>
    <g>
      <circle cx="367" cy="392" r="4" fill="#bb790d"/><circle cx="409" cy="392" r="4" fill="#bb790d"/><circle cx="449" cy="392" r="4" fill="#23714f"/>
      <circle cx="480" cy="378" r="4" fill="#bb790d"/><circle cx="520" cy="378" r="4" fill="#4d608c"/>
      <circle cx="583" cy="406" r="4" fill="#23714f"/><circle cx="623" cy="406" r="4" fill="#247ca0"/>
    </g>
    <use href="#path" x="233" y="506"/><circle cx="313" cy="506" r="6" fill="#23714f"/>
    <use href="#path" x="233" y="545"/><circle cx="313" cy="545" r="6" fill="#4d608c"/>
    <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m350 506 5 5 9-10" stroke="#23714f"/>
      <path d="m352 541 10 10m0-10-10 10" stroke="#a33838"/>
    </g>
    <g fill="none" stroke="#5d7086" stroke-width="2">
      <path d="M313 515v10H190v110h143" marker-end="url(#arrow)"/>
      <path d="M519 635h12" marker-end="url(#arrow)"/>
