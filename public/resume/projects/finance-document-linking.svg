    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#5d7086" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="document" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-13-16H3l10 10v22h-26z" fill="#fff"/>
      <path d="M3-16v10h10M-7 1H7M-7 7H5" fill="none"/>
    </g>
    <g id="graph" stroke="currentColor" stroke-width="2">
      <path d="m-19-12 19 12 17-13m-17 13-16 15m16-15 19 16m-36-31 13-6" fill="none"/>
      <g fill="#fff"><circle r="7"/><circle cx="-19" cy="-12" r="4"/><circle cx="17" cy="-13" r="4"/><circle cx="-16" cy="15" r="4"/><circle cx="19" cy="16" r="4"/><circle cx="-4" cy="-21" r="3"/></g>
    </g>
    <g id="pairs" fill="#39485d" stroke="#a8b4c2" stroke-width="2">
      <path d="M0 0h40M0 14h40M0 28h40"/>
      <g stroke="none"><circle r="4"/><circle cx="40" r="4"/><circle cy="14" r="4"/><circle cx="40" cy="14" r="4"/><circle cy="28" r="4"/><circle cx="40" cy="28" r="4"/></g>
    </g>
    <g id="path" fill="none" stroke="#8d9bad" stroke-width="3">
      <path d="M0 0h80"/>
      <circle r="6" fill="#39485d" stroke="none"/><circle cx="40" r="6" fill="#bb790d" stroke="none"/>
    </g>
  </defs>
  <rect width="680" height="682" fill="#f6f8fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#15263b">
    <rect x="196" y="18" width="288" height="54" rx="12" fill="#e8eff8" stroke="#c3d2e4"/>
    <use href="#document" transform="translate(226 45)" color="#345f92"/>
    <text x="356" y="52" font-size="23" font-weight="700">Source documents</text>

    <g fill="none" stroke="#5d7086" stroke-width="2">
      <path d="M340 72v16H142v16" marker-end="url(#arrow)"/>
      <path d="M340 88h132v16" marker-end="url(#arrow)"/>
      <path d="M142 170v13" marker-end="url(#arrow)"/>
      <path d="M142 273v27" marker-end="url(#arrow)"/>
      <path d="M256 344h18v-56h26" marker-end="url(#arrow)"/>
      <path d="M472 170v16m-125 30v-13h82v13m-41-13v-17h163v17m-51 13v-13h103v13"/>
      <path d="M347 309v14" marker-end="url(#arrow)"/>
      <path d="M429 309v14" marker-end="url(#arrow)"/>
      <path d="M500 309v14" marker-end="url(#arrow)"/>
      <path d="M603 309v14" marker-end="url(#arrow)"/>
      <path d="M472 410v22" marker-end="url(#arrow)"/>
    </g>
    <g fill="#fff" stroke="#ccd7e4">
      <rect x="28" y="108" width="228" height="62" rx="10"/>
      <rect x="304" y="108" width="336" height="62" rx="10"/>
      <rect x="28" y="187" width="228" height="86" rx="10"/>
