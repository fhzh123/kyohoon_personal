    <g font-size="23" font-weight="700">
      <text x="142" y="147">Topic modeling</text>
      <text x="472" y="147">Chunk by article</text>
      <text x="142" y="338">Vocabulary</text>
      <text x="472" y="293">Head / Sub-head</text>
      <text x="334" y="469">Build multi-hop paths within the same level</text>
      <text x="428" y="642">Generate Q&amp;A</text>
      <text x="588" y="642">Q / A</text>
    </g>
    <g font-size="22" fill="#344b63">
      <text x="142" y="220">Word clusters</text>
      <text x="142" y="249">Document clusters</text>
      <text x="142" y="365">by topic</text>
