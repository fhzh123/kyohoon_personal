<svg xmlns="http://www.w3.org/2000/svg" width="680" height="682" viewBox="0 0 680 682" role="img" aria-labelledby="title description">
  <title id="title">Financial document linking and metadata</title>
  <desc id="description">Source documents are split by article into a hierarchy. In parallel, topic modeling clusters words and documents to build a vocabulary. That vocabulary informs per-article head and sub-head graphs. Links from the same hierarchy level can be combined into multi-hop paths for question answering.</desc>
