name: Travel and login checks
on:
  push:
    branches: [main, fix/travel-resume-state]
  pull_request:
    paths:
      - 'public/travel/**'
      - 'views/**'
      - 'server/**'
      - 'tests/**'
      - 'work-app/**'
      - 'types/**'
      - 'scripts/build.mjs'
      - 'package*.json'
      - '.github/workflows/travel.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify research planning and resource calculations
        run: node --test tests/research-features.test.mjs tests/work-dom.test.mjs

      - name: Verify public travel endpoints
        run: node scripts/check-travel-live.mjs
        env:
          EXPECT_TRAVEL_VERSION: ${{ github.ref == 'refs/heads/main' && '20261117-1' || '' }}
