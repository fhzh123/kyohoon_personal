name: Travel and login checks
on:
  push:
    branches: [main, fix/travel-resume-state]
  pull_request:
    paths:
      - 'public/travel/**'
      - 'views/**'
      - 'server/**'
      - 'tests/**'
      - 'work-app/**'
      - 'types/**'
      - 'scripts/build.mjs'
      - 'package*.json'
      - '.github/workflows/travel.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify research planning and resource calculations
        run: node --test tests/research-features.test.mjs tests/work-dom.test.mjs

      - name: Verify shared home navigation
        run: node --test tests/space-navigation.test.mjs tests/spaces.test.mjs tests/gallery.test.mjs tests/paper-preferences.test.mjs tests/paper-layout.test.mjs tests/demos.test.mjs tests/settings-access.test.mjs

      - name: Verify public travel endpoints
        # On main, wait until production serves the travel.js version this commit
        # ships. The version is read from views/travel.mjs so it never goes stale.
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            EXPECT_TRAVEL_VERSION=$(grep -o 'travel/travel.js?v=[0-9-]*' views/travel.mjs | head -1 | cut -d= -f2)
            test -n "$EXPECT_TRAVEL_VERSION" || { echo 'travel.js version not found in views/travel.mjs'; exit 1; }
            export EXPECT_TRAVEL_VERSION
          fi
          node scripts/check-travel-live.mjs
