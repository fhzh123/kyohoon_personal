name: Conference deadlines
# Every Thursday 09:00 KST (00:00 UTC) rebuild server/deadlines/deadlines.json and push it to main.
# Vercel deploys main, so the Paper deadline page shows the new data a few minutes later.
# GitHub may start a scheduled run some minutes late when its runners are busy.
on:
  schedule:
    - cron: '0 0 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conference-deadlines
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch the public deadline datasets
        run: |
          mkdir -p "$RUNNER_TEMP/sources"
          git clone --depth 1 https://github.com/ccfddl/ccf-deadlines "$RUNNER_TEMP/sources/ccf-deadlines"
          git clone --depth 1 https://github.com/huggingface/ai-deadlines "$RUNNER_TEMP/sources/ai-deadlines"
      - name: Rebuild the deadline data
        run: node scripts/deadlines-sync.mjs --local "$RUNNER_TEMP/sources" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the rebuilt data
        run: node --test tests/paper-deadlines.test.mjs tests/paper-workspaces.test.mjs
      - name: Push to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/deadlines/deadlines.json
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          git commit -m 'Update conference deadlines (weekly)'
          git push origin HEAD:main
